name: Integración continua

on:
  push:
    # Las ramas de corrección y de mantenimiento se quedaban fuera: una
    # rama fix/** no ejecutaba nada hasta que se abría la solicitud de
    # incorporación, que es justo cuando ya es tarde para enterarse.
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, develop]

# Cancela las ejecuciones que un envío posterior ya dejó obsoletas: si se
# empuja dos veces seguidas, la primera no informa de nada.
#
# El evento forma parte de la clave a propósito. Una rama con solicitud
# de incorporación abierta se ejecuta dos veces, por el envío y por la
# solicitud, y las dos comprueban cosas distintas: el envío comprueba la
# rama, y la solicitud comprueba el resultado de fusionarla con su base,
# que es donde aparece lo que la rama no puede ver. Dos ramas que tocan
# el mismo archivo pasan cada una por su lado y chocan al fusionar.
#
# Sin el evento en la clave, una cancelaba a la otra, la cancelada
# quedaba registrada como no satisfactoria y la solicitud aparecía en
# estado «unstable» aunque todo estuviera en verde.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  esquema:
    name: Migraciones de base de datos
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: sgip_ci
          MYSQL_DATABASE: sgip
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psgip_ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      # El orden va escrito a mano. Con un comodín, el orden alfabético
      # pone V10 antes de V2 y la cadena falla en la primera clave
      # foránea. V8 va antes de V9 y V10 porque esas dos migran las filas
      # que V8 carga.
      - name: Aplicar migraciones en orden
        run: |
          set -e
          for f in V1__seguridad V2__catalogo V3__parametrizacion V4__comercial \
                   V5__funciones V6__vistas V7__datos_iniciales V8__datos_demo \
                   V9__rol_super_admin_y_venta_sin_existencia \
                   V10__plataforma_multiempresa \
                   V11__claves_compuestas_por_empresa \
                   V12__configuracion_tributaria_por_empresa \
                   V13__logo_de_empresa \
                   V14__miniatura_de_imagen \
                   V15__vista_de_precios_acotada_por_empresa \
                   V16__retirar_parametros_de_imagen \
                   V17__vista_de_precios_expone_los_identificadores \
                   V18__movimientos_admiten_existencia_negativa \
                   V19__la_valorizacion_no_resta_lo_que_se_debe \
                   V20__la_vista_de_precios_cierra_la_modalidad_a_credito \
                   V21__auditoria_de_la_plataforma \
                   V22__parametros_de_la_plataforma \
                   V23__el_kardex_se_explica_solo \
                   V24__claves_por_empresa_en_compras \
                   V25__el_precio_respeta_la_forma_de_calculo \
                   V26__el_tipo_de_un_parametro_obliga \
                   V27__el_periodo_de_prueba_se_mide_en_meses \
                   V28__claves_por_empresa_en_importacion \
                   V29__el_rechazo_dice_en_que_fila \
                   V30__el_rechazo_tiene_categoria \
                   V31__claves_por_empresa_en_lo_comercial; do
            echo "→ $f"
            # El motivo del fallo se emite como anotación además de ir al
            # registro. Sin esto, una migración que falla deja un «exit
            # code 1» y el porqué solo se ve abriendo el registro a mano:
            # la API de comprobaciones expone las anotaciones y no el
            # registro, de modo que el diagnóstico queda fuera del alcance
            # de cualquier herramienta que consulte el resultado.
            if ! salida=$(mysql -h 127.0.0.1 -u root -psgip_ci sgip \
                            < "database/migrations/$f.sql" 2>&1); then
              echo "$salida"
              echo "::error file=database/migrations/$f.sql::$f falló · $(printf '%s' "$salida" | grep -m1 -i '^ERROR' || printf '%s' "$salida" | head -1)"
              exit 1
            fi
            # Un ERROR en la salida sin código distinto de cero también
            # cuenta: el cliente los mezcla según cómo se le invoque, y
            # una migración a medias es peor que una que no corrió.
            if printf '%s' "$salida" | grep -qi '^ERROR'; then
              echo "$salida"
              echo "::error file=database/migrations/$f.sql::$f dejó un error · $(printf '%s' "$salida" | grep -m1 -i '^ERROR')"
              exit 1
            fi
          done

      - name: Verificar el conteo de objetos
        run: |
          consulta () { mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e "$1"; }
          tablas=$(consulta "SELECT COUNT(*) FROM information_schema.tables
                             WHERE table_schema='sgip' AND table_type='BASE TABLE';")
          vistas=$(consulta "SELECT COUNT(*) FROM information_schema.views
                             WHERE table_schema='sgip';")
          funciones=$(consulta "SELECT COUNT(*) FROM information_schema.routines
                                WHERE routine_schema='sgip' AND routine_type='FUNCTION';")
          echo "tablas=$tablas vistas=$vistas funciones=$funciones"
          test "$tablas" -eq 41
          test "$vistas" -eq 6
          test "$funciones" -eq 4

      # El conteo de tablas puede cuadrar con la V9 aplicada a medias,
      # porque la V9 no crea tablas: solo agrega columnas. Esta columna es
      # lo último que crea, así que su ausencia delata que se detuvo.
      - name: Verificar que la V9 se aplicó completa
        run: |
          n=$(mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e \
            "SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='sgip' AND table_name='ventas'
               AND column_name='sin_existencia';")
          test "$n" -eq 1

      # Veinte de la V11, cuatro de la V12, cinco de la V24 y siete de
      # la V28.
      #
      # Este número se sube a mano al añadir claves, y a propósito: es un
      # centinela, no un conteo informativo. Una migración que quita una
      # clave por empresa sin que nadie lo decida deja la entrega en rojo,
      # y eso es justo lo que tiene que pasar. La V28 lo puso en rojo al
      # subir de 29 a 36, que era la señal correcta.
      # Dos centinelas, y miden cosas distintas a propósito.
      #
      # El conteo ve una clave que desaparece. Su número está también en
      # `database/aplicar.sh`, porque este trabajo aplica las migraciones
      # con su propio bucle y no a través de ese guion; al subirlo hay
      # que subirlo en los dos sitios. La V31 lo comprobó por las malas:
      # se subió aquí y no allí, y este paso dejó el trabajo en rojo.
      #
      # El segundo no tiene número que mantener: toda clave foránea que
      # apunte a una tabla con `empresa_id` debe incluir `empresa_id`.
      # Una clave nueva que se olvide de la empresa aparece el día que se
      # escribe. Es el que importa de los dos; el conteo se queda porque
      # cubre el caso que este no ve.
      #
      # Las dos excepciones van nombradas una por una, no por tabla, para
      # que una clave nueva desde esas mismas tablas no herede la
      # excepción. El porqué de cada una está en la V31.
      - name: Verificar las claves foráneas por empresa
        run: |
          n=$(mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e \
            "SELECT COUNT(*) FROM information_schema.referential_constraints
             WHERE constraint_schema='sgip' AND constraint_name LIKE '%\\_emp';")
          echo "claves foráneas por empresa: $n"
          test "$n" -eq 46

          descuidadas=$(mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e \
            "SELECT GROUP_CONCAT(x.table_name, '.', x.constraint_name SEPARATOR ', ')
               FROM (SELECT k.table_name, k.constraint_name,
                            GROUP_CONCAT(k.column_name ORDER BY k.ordinal_position) cols
                       FROM information_schema.key_column_usage k
                      WHERE k.table_schema='sgip'
                        AND k.referenced_table_name IS NOT NULL
                        AND k.referenced_table_name <> 'empresas'
                        AND k.constraint_name NOT IN ('fk_sesiones_usuario',
                                                      'fk_auditoria_plataforma_usuario')
                        AND EXISTS (SELECT 1 FROM information_schema.columns c
                                     WHERE c.table_schema='sgip'
                                       AND c.table_name = k.referenced_table_name
                                       AND c.column_name = 'empresa_id')
                      GROUP BY k.constraint_schema, k.constraint_name, k.table_name) x
              WHERE FIND_IN_SET('empresa_id', x.cols) = 0;")
          if [ -n "$descuidadas" ] && [ "$descuidadas" != "NULL" ]; then
            echo "::error title=Claves foráneas sin empresa_id::$descuidadas"
            exit 1
          fi
          echo "ninguna clave hacia una tabla por empresa se olvida de empresa_id"

      # El conteo de vistas no cambia con la V18, la V19 ni la V20: la
      # primera solo toca restricciones y las otras dos recrean vistas que
      # ya existían. Estos dos pasos miran lo que esas migraciones dejan.
      - name: Verificar que el kárdex admite existencia negativa (V18)
        run: |
          n=$(mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e \
            "SELECT COUNT(*) FROM information_schema.check_constraints
             WHERE constraint_schema='sgip'
               AND constraint_name IN ('ck_movimientos_anterior','ck_movimientos_posterior')
               AND check_clause LIKE '%9999%';")
          test "$n" -eq 2

      - name: Verificar las columnas nuevas de las vistas (V19 y V20)
        run: |
          n=$(mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e \
            "SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='sgip' AND (
               (table_name='v_precios_producto'
                AND column_name IN ('total_credito','cerca_umbral_credito','cruza_umbral_en_credito'))
               OR (table_name='v_inventario_valorizado'
                AND column_name IN ('unidades_pendientes','valor_pendiente_al_costo'))
               OR (table_name='v_rotacion_inventario'
                AND column_name IN ('unidades_pendientes','valor_pendiente_al_costo')));")
          echo "columnas nuevas de la V19 y la V20: $n"
          test "$n" -eq 7

      - name: Verificar la coherencia del kárdex (V23)
        run: |
          n=$(mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e \
            "SELECT COUNT(*) FROM information_schema.check_constraints
             WHERE constraint_schema='sgip'
               AND constraint_name='ck_movimientos_coherencia';")
          test "$n" -eq 1
          n=$(mysql -h 127.0.0.1 -u root -psgip_ci -N -B -e \
            "SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='sgip' AND table_name='movimientos_inventario'
               AND column_name='observacion';")
          test "$n" -eq 0

      - name: Verificar el aislamiento entre empresas
        run: bash database/verificar_aislamiento.sh -h 127.0.0.1 -u root -psgip_ci

      - name: Verificar la invariante del kárdex (RF-49)
        run: bash database/verificar_kardex.sh -h 127.0.0.1 -u root -psgip_ci

      - name: Verificar el motor de precios (RF-30 a RF-32, RF-34)
        run: bash database/verificar_precios.sh -h 127.0.0.1 -u root -psgip_ci

      - name: Verificar la configuración tributaria por empresa
        run: bash database/verificar_tributacion.sh -h 127.0.0.1 -u root -psgip_ci

      # El SQL que los repositorios escriben a mano no lo valida nadie
      # más: Hibernate solo mira las entidades, las pruebas de unidad
      # simulan JdbcClient y la única que toca una base arranca el
      # contexto sin pasar por ninguna consulta. Una columna mal escrita
      # compilaba, pasaba la entrega en verde y reventaba en la pantalla.
      # No basta con que la restricción exista: tiene que rechazar. Se
      # intentan las cuatro filas que la V26 viene a impedir y el paso
      # falla si alguna entra. Una restricción que no se ha visto negar
      # nada es una línea que da tranquilidad, no un guardián.
      - name: Verificar el aislamiento de la importación de listas (V28)
        run: bash database/verificar_importacion.sh -h 127.0.0.1 -u root -psgip_ci

      # Las cinco lecturas del panel (P-02). Construye su propio
      # histórico de costos porque los datos de demostración lo dejan
      # vacío: sin esa construcción, la consulta de cruces de umbral
      # devuelve cero filas y el paso estaría en verde sin haber
      # ejecutado la parte que importa. El guion falla si la consulta
      # devuelve cero.
      - name: Verificar las lecturas del panel de indicadores (P-02)
        run: bash database/verificar_panel.sh -h 127.0.0.1 -u root -psgip_ci

      - name: Verificar que el tipo de un parámetro obliga (V26)
        run: |
          rechaza () {
            if mysql -h 127.0.0.1 -u root -psgip_ci sgip -e "$1" 2>/dev/null; then
              echo "::error::entró una fila que la V26 debía rechazar · $2"
              exit 1
            fi
          }
          rechaza "INSERT INTO parametros_plataforma (clave,valor,tipo_dato,vigente_desde)
                   VALUES ('sgip.plataforma.prueba.dias','treinta','ENTERO','2027-01-01');" \
                  "un ENTERO que no es un número"
          rechaza "INSERT INTO parametros_plataforma (clave,valor,tipo_dato,vigente_desde)
                   VALUES ('sgip.plataforma.prueba.dias','-5','ENTERO','2027-01-01');" \
                  "un periodo de prueba negativo"
          rechaza "INSERT INTO parametros_plataforma (clave,valor,tipo_dato,vigente_desde)
                   VALUES ('sgip.plataforma.prueba.dias','400','ENTERO','2027-01-01');" \
                  "un periodo de prueba de más de un año"
          rechaza "INSERT INTO parametros (empresa_id,clave,valor,tipo_dato,vigente_desde)
                   VALUES (1,'sgip.prueba.bool','quizá','BOOLEANO','2026-01-01');" \
                  "un BOOLEANO inventado"
          # Y el valor correcto sí tiene que entrar, o la restricción
          # estaría rechazándolo todo y las cuatro de arriba pasarían
          # por el motivo equivocado.
          mysql -h 127.0.0.1 -u root -psgip_ci sgip -e \
            "INSERT INTO parametros_plataforma (clave,valor,tipo_dato,vigente_desde)
             VALUES ('sgip.plataforma.prueba.dias','45','ENTERO','2027-01-01');
             DELETE FROM parametros_plataforma WHERE vigente_desde='2027-01-01';"

      # El RF-04 pide que la prueba venza «el mismo día del mes
      # siguiente». Lo que esto comprueba es que el parámetro que el alta
      # lee sea el de meses y esté vigente: si la V27 no corriera, la
      # consulta del backend no encontraría fila y el alta caería al
      # valor por omisión sin que nada lo dijera.
      - name: Verificar que el periodo de prueba se mide en meses (V27)
        run: |
          consulta () { mysql -h 127.0.0.1 -u root -psgip_ci -N -B sgip -e "$1"; }
          vigente=$(consulta "SELECT valor FROM parametros_plataforma
                               WHERE clave = 'sgip.plataforma.prueba.meses'
                                 AND vigente_desde <= CURDATE()
                                 AND (vigente_hasta IS NULL OR vigente_hasta >= CURDATE());")
          test "$vigente" = "1" || {
            echo "::error::el parámetro de meses no rige · valor leído: '$vigente'"; exit 1; }
          # Y el de días tiene que haber dejado de regir, o habría dos
          # respuestas vivas para la misma pregunta.
          abierto=$(consulta "SELECT COUNT(*) FROM parametros_plataforma
                               WHERE clave = 'sgip.plataforma.prueba.dias'
                                 AND (vigente_hasta IS NULL OR vigente_hasta >= CURDATE());")
          test "$abierto" -eq 0 || {
            echo "::error::el parámetro de días sigue vigente"; exit 1; }
          if mysql -h 127.0.0.1 -u root -psgip_ci sgip -e \
              "INSERT INTO parametros_plataforma (clave,valor,tipo_dato,vigente_desde)
               VALUES ('sgip.plataforma.prueba.meses','25','ENTERO','2028-01-01');" 2>/dev/null
          then echo "::error::entró un periodo de prueba de 25 meses"; exit 1; fi

      - name: Analizar el SQL escrito a mano del backend
        run: python3 database/verificar_sql_del_backend.py -h 127.0.0.1 -u root -psgip_ci

      # Esta restricción queda fuera de la cadena porque no se pudo
      # verificar; el archivo explica por qué. Aquí se intenta y se
      # informa el resultado sin hacer fallar el trabajo: si MySQL la
      # acepta, el registro de CI lo deja por escrito.
      - name: Intentar la restricción opcional de ámbito de regla de IVA
        continue-on-error: true
        run: |
          mysql -h 127.0.0.1 -u root -psgip_ci sgip \
            < database/extras/restriccion_ambito_regla_iva.sql \
            && echo "MySQL la aceptó" \
            || echo "MySQL la rechazó: la invariante queda a cargo de la aplicación"

  backend:
    name: Compilación y pruebas del backend
    runs-on: ubuntu-latest
    # El esquema tiene que estar aplicado antes de arrancar el contexto:
    # la aplicación corre con ddl-auto en validate y se niega a levantar
    # contra una base vacía.
    needs: esquema
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: sgip_ci
          MYSQL_DATABASE: sgip
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psgip_ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Mismo orden escrito a mano que en el trabajo del esquema, y por el
      # mismo motivo: con un comodín, V10 va antes que V2.
      - name: Aplicar migraciones en orden
        run: |
          set -e
          for f in V1__seguridad V2__catalogo V3__parametrizacion V4__comercial \
                   V5__funciones V6__vistas V7__datos_iniciales V8__datos_demo \
                   V9__rol_super_admin_y_venta_sin_existencia \
                   V10__plataforma_multiempresa \
                   V11__claves_compuestas_por_empresa \
                   V12__configuracion_tributaria_por_empresa \
                   V13__logo_de_empresa \
                   V14__miniatura_de_imagen \
                   V15__vista_de_precios_acotada_por_empresa \
                   V16__retirar_parametros_de_imagen \
                   V17__vista_de_precios_expone_los_identificadores \
                   V18__movimientos_admiten_existencia_negativa \
                   V19__la_valorizacion_no_resta_lo_que_se_debe \
                   V20__la_vista_de_precios_cierra_la_modalidad_a_credito \
                   V21__auditoria_de_la_plataforma \
                   V22__parametros_de_la_plataforma \
                   V23__el_kardex_se_explica_solo \
                   V24__claves_por_empresa_en_compras \
                   V25__el_precio_respeta_la_forma_de_calculo \
                   V26__el_tipo_de_un_parametro_obliga \
                   V27__el_periodo_de_prueba_se_mide_en_meses \
                   V28__claves_por_empresa_en_importacion \
                   V29__el_rechazo_dice_en_que_fila \
                   V30__el_rechazo_tiene_categoria \
                   V31__claves_por_empresa_en_lo_comercial; do
            # El motivo del fallo se emite como anotación además de ir al
            # registro. Sin esto, una migración que falla deja un «exit
            # code 1» y el porqué solo se ve abriendo el registro a mano:
            # la API de comprobaciones expone las anotaciones y no el
            # registro, de modo que el diagnóstico queda fuera del alcance
            # de cualquier herramienta que consulte el resultado.
            if ! salida=$(mysql -h 127.0.0.1 -u root -psgip_ci sgip \
                            < "database/migrations/$f.sql" 2>&1); then
              echo "$salida"
              echo "::error file=database/migrations/$f.sql::$f falló · $(printf '%s' "$salida" | grep -m1 -i '^ERROR' || printf '%s' "$salida" | head -1)"
              exit 1
            fi
            # Un ERROR en la salida sin código distinto de cero también
            # cuenta: el cliente los mezcla según cómo se le invoque, y
            # una migración a medias es peor que una que no corrió.
            if printf '%s' "$salida" | grep -qi '^ERROR'; then
              echo "$salida"
              echo "::error file=database/migrations/$f.sql::$f dejó un error · $(printf '%s' "$salida" | grep -m1 -i '^ERROR')"
              exit 1
            fi
          done

      # application.yml no se versiona. Se arma desde el ejemplo, que es
      # justamente la comprobación de que el ejemplo sigue estando al día.
      - name: Preparar la configuración
        run: |
          cd backend/src/main/resources
          cp application.yml.ejemplo application.yml

      - name: Compilar y probar
        env:
          SGIP_BD_USUARIO: root
          SGIP_BD_CLAVE: sgip_ci
          # El MySQL del servicio levanta con certificado autofirmado. No
          # hay nada que proteger entre dos contenedores de la misma
          # máquina efímera, y verificarlo solo añade un modo de fallo.
          SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/sgip?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota"
        run: |
          set -o pipefail
          if ! mvn -B -f backend/pom.xml verify 2>&1 | tee /tmp/maven.log; then
            # El registro completo vive en un almacenamiento aparte que no
            # todo cliente alcanza. Las anotaciones sí viajan con el
            # resultado, de modo que el motivo del fallo se publica ahí.
            grep -E "^\[ERROR\].*\.java|^\[ERROR\][[:space:]]+[A-Za-z]+Test|expected:|Tests run:.*(Failures: [1-9]|Errors: [1-9])|^Caused by:|SchemaManagementException|missing column|wrong column type" \
                 /tmp/maven.log | head -25 | while IFS= read -r linea; do
              echo "::error::${linea}"
            done
            exit 1
          fi

  web:
    name: Compilación del front web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La 22 es la que se usó para escribirlo. Las versiones se fijan y
      # no se mueven a mitad de sprint (ADR-0010).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
